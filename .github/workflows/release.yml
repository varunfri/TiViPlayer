name: Release TiviPlayer TV

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.2.3
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Android Release Build
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="manual"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/TiviPlayer-${TAG_NAME}-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/TiviPlayer-*-android.apk
          retention-days: 1

  # ============================================================================
  # 2. macOS Desktop Release Build (.dmg)
  # ============================================================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS DMG Installer
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="manual"
          
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p release-artifacts
          DMG_PATH="release-artifacts/TiviPlayer-${TAG_NAME}-macos.dmg"

          echo "Packaging $APP_NAME into $DMG_PATH..."
          STAGING_DIR=$(mktemp -d /tmp/tiviplayer_dmg_staging.XXXXXX)
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGING_DIR"
          
          echo "DMG Created successfully:"
          ls -lh "$DMG_PATH"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-dmg
          path: release-artifacts/TiviPlayer-*-macos.dmg
          retention-days: 1

  # ============================================================================
  # 3. Web Release Build (.zip)
  # ============================================================================
  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Bundle
        run: flutter build web --release

      - name: Package Web Distribution
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="manual"
          mkdir -p release-artifacts
          cd build/web
          zip -r "../../release-artifacts/TiviPlayer-${TAG_NAME}-web.zip" .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: release-artifacts/TiviPlayer-*-web.zip
          retention-days: 1

  # ============================================================================
  # 4. Publish GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List Artifacts to be Released
        run: |
          echo "Release Assets:"
          ls -lh all-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: all-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
